<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>トップページ</title>
    <link rel='stylesheet' href='main.css'>
    <style>
        #wrap{width: 640px; margin: 20px auto;}

        #header{padding: 10px; border: 0cap; background-color: aquamarine;}

        #main{margin: 50px ; background-color: red;}

        #section{margin: 50px; padding: 10px; border: 40px; background-color: bisque;}
        
        #section li{list-style-type: square;}

        #header > p {line-height: 1.6;}

        #h1, h2, p {margin: 0;}

    </style>
</head>
<body id="#wrap">
    <div id = "header">
        <h1>ボックスモデル確認カード</h1>
        <p>CSSでは、要素を四角い箱として考えます</p>
        <p>箱には、内容、内側の余白、枠線、外側の余白があります。</p>
    </div>

    <div id = "main">
        
        <h2>確認すること</h2>
        <div id= "section">
            <ul>
                <li>widthで内容の幅を指定する</li>
                <li>paddingで内側の余白を指定する</li>
                <li>borderで枠線を指定する</li>
                <li>marginで外側の余白を指定する</li>
            </ul>
        </div>

    </div>

    <div id = "footer">
       <p>Web制作Ⅰ ボックスモデル練習</p>
    </div>
    
</body>
</html>
