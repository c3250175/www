<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Click Counter ★ switch構文</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Click Counter ★ switch構文</h1>

    <p>
        ボタンをクリックすると、クリック回数に応じて結果が変わります。<br>
        JavaScriptのswitch構文を使って処理を作ってみましょう。
    </p>

    <div class="container">

        <div class="counter">
            クリック回数　
            <span id="count">0</span> 回
        </div>

        <button id="clickButton">クリック</button>

        <h3>結果</h3>

        <div id="result">
            ここに結果が表示されます
        </div>

    </div>

    <footer>
        © JavaScript Practice – switch構文 ＆ クリックイベント
    </footer>

</body>
</html>
