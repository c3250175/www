<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>予約受付</title>

        <style>
            body{
                font-family: sans-serif;
            }

            table{
                border-collapse: collapse;
                text-align: center;
            }


            h2{
                font-size: 24px;
            }

            th{
                background-color: #fc9;
                border: 1px solid black;
                padding: 10px;
            }

            td{
                border: 1px solid black;
                padding: 10px;
            }

            td:first-child{
                background-color: #fc9;
                font-weight: bold;
            }

            button{
                padding: 5px 10px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h2>利用料の計算</h2>

        <table>
            <tr>
                <th>No.</th>
                <th>料金</th>
                <th>人数</th>
                <th>a×b</th>
            </tr>

            <tr>
                <td>0</td>
                <td>500</td>
                <td>10</td>
                <td><button onclick="multiply(0)">利用料の合計</button></td>
            </tr>

            <tr>
                <td>1</td>
                <td>980</td>
                <td>16</td>
                <td><button onclick="multiply(1)">利用料の合計</button></td>
            </tr>

            <tr>
                <td>2</td>
                <td>1200</td>
                <td>8</td>
                <td><button onclick="multiply(2)">利用料の合計</button></td>
            </tr>
        </table>

        <hr>

        <h2>予約受付</h2>
        
        <p id="yoyaku">予約受付中</p>

        <button id="btn"onclick="yoyaku()">予約する</button>

        <script>
            let a=[500,980,1200]
            let b=[10,16,8]
            function multiply(i){
                let anser = a[i]*b[i];
                alert("料金は"+anser+"円です");
            }
            
            function yoyaku(){
                document.getElementById("yoyaku").innerHTML="予約済み";

                document.getElementById("btn").remove();

                document.getElementById("yoyaku").innerHTML+="<br>ありがとうございました。";
            }
        </script>
    </body>
</html>
